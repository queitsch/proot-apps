name: build-on-commit

# Builds every app whose folder under apps/ changed and pushes it to
# ghcr.io/<owner>/<repo>:<app>, the image SealSkin and proot-apps install.
# Adapted from linuxserver/proot-apps. The apps build on the public base
# images of linuxserver/proot-apps, so no base image is built here.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build and push all apps"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  meta:
    name: Ingest Metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-meta
        run: |
          curl -o yq -L "https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64"
          chmod +x yq
          echo "matrix=$(./yq -o=j -I=0 '.' metadata/metadata.yml)" >> $GITHUB_OUTPUT
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - meta
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            folder:
              - "apps/${{ matrix.name }}/**"
      - if: steps.changes.outputs.folder == 'true' || (inputs.build_all && matrix.disabled != true)
        run: >
          cd apps/${{ matrix.name }}/ &&
          docker buildx build --push
          --platform ${{ matrix.arch }}
          --build-arg REPO=${GITHUB_REPOSITORY,,}
          --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}
          --tag ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.name }} .
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
